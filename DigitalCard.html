  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #14141f;
      --border: #2a2a3a;
      --accent: #e8c547;
      --accent-glow: rgba(232, 197, 71, 0.15);
      --text: #f0ece2;
      --text-dim: #8a8680;
      --text-muted: #5a5650;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 36px;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }

    .card-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid var(--accent);
      margin: 0 auto 20px;
    }

    .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-role {
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .card-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .card-link:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    .card-link svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .card-footer {
      margin-top: 24px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
