<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Sharma — Digital Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylesheet.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .digital-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .digital-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--chaos), var(--peace));
    }

    .card-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      margin: 0 auto 24px;
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .card-name {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-role {
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .card-location {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .card-divider {
      width: 40px;
      height: 2px;
      background: var(--border);
      margin: 0 auto 24px;
      border-radius: 1px;
    }

    .card-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all var(--transition);
      text-decoration: none;
    }
    .card-link:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .card-link .link-icon {
      font-size: 1.1rem;
    }

    .card-footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .card-footer .accent {
      color: var(--accent);
    }

    /* Light theme override for card */
    body.light .digital-card {
      background: #ffffff;
      border-color: #ddd8cc;
    }
    body.light .card-link {
      background: #f5f2eb;
      border-color: #ddd8cc;
    }
  </style>
</head>
<body>

  <div class="digital-card">
    <img class="card-photo" src="Images/Aditya.JPG" alt="Aditya Sharma">
    <h2 class="card-name">Aditya Sharma</h2>
    <p class="card-role">AI Software Engineer</p>
    <div class="card-divider"></div>
    <div class="card-links">
      <a href="https://www.linkedin.com/in/adityaashoksharma/" target="_blank" rel="noopener" class="card-link">
        <span class="link-icon">in</span>
        LinkedIn
      </a>
      <a href="https://github.com/Aditya-A-Sharma" target="_blank" rel="noopener" class="card-link">
        <span class="link-icon">⌥</span>
        GitHub
      </a>
      <a href="mailto:hello@adityasharma.in" class="card-link">
        <span class="link-icon">✉</span>
        Email
      </a>
      <a href="https://www.adityasharma.in" target="_blank" rel="noopener" class="card-link">
        <span class="link-icon">🌐</span>
        Portfolio
      </a>
    </div>
    <p class="card-footer">Built with <span class="accent">chaos</span> & calm</p>
  </div>

  <script src="scriptsheet.js"></script>
</body>
</html>
